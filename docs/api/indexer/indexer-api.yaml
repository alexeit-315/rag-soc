  /health:
    get:
      summary: Liveness probe
      description: |
        Проверка живости сервиса для Kubernetes liveness probe.
        Возвращает 200 OK если сервис работает (процесс жив).
        Не проверяет зависимости (для этого есть /ready).
      operationId: health
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис жив
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "healthy"
                version: "1.0.0"
                components: {}
        '503':
          description: Сервис нездоров
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: "unhealthy"
                version: "1.0.0"
                components: {}
  
  /ready:
    get:
      summary: Readiness probe
      description: |
        Проверка готовности сервиса для Kubernetes readiness probe.
        Проверяет доступность всех зависимостей (PostgreSQL, Vector DB, Elasticsearch, Kafka).
        Возвращает 200 OK только если сервис готов принимать трафик.
      operationId: ready
      tags: [System]
      security: []
      responses:
        '200':
          description: Сервис готов принимать трафик
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                ready: true
                checks:
                  postgres: true
                  vector_db: true
                  elasticsearch: true
                  kafka: true
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                ready: false
                checks:
                  postgres: true
                  vector_db: true
                  elasticsearch: false
                  kafka: true
  
  /metrics:
    get:
      summary: Prometheus метрики
      description: |
        Возвращает метрики в формате Prometheus для мониторинга.
        
        **Доступные метрики:**
        - `indexer_requests_total` — общее количество запросов
        - `indexer_requests_duration_seconds` — длительность запросов (histogram)
        - `indexer_errors_total` — количество ошибок
        - `indexer_jobs_total` — количество задач по статусу
        - `indexer_active_jobs` — количество активных задач
        - `indexer_documents_processed_total` — обработанные документы
        - `indexer_chunks_created_total` — созданные чанки
        - `indexer_embedding_calls_total` — вызовы Embedding Service
      operationId: metrics
      tags: [System]
      security: []
      responses:
        '200':
          description: Метрики в формате Prometheus
          content:
            text/plain:
              schema:
                type: string
              example: |
                # HELP indexer_requests_total Total number of requests
                # TYPE indexer_requests_total counter
                indexer_requests_total{method="POST",endpoint="/index"} 42
                indexer_requests_total{method="GET",endpoint="/index/status"} 156
                
                # HELP indexer_jobs_total Total number of indexing jobs
                # TYPE indexer_jobs_total counter
                indexer_jobs_total{status="pending"} 5
                indexer_jobs_total{status="processing"} 3
                indexer_jobs_total{status="completed"} 28
                indexer_jobs_total{status="failed"} 4
                indexer_jobs_total{status="cancelled"} 2
                
                # HELP indexer_active_jobs Currently active jobs
                # TYPE indexer_active_jobs gauge
                indexer_active_jobs 3
                
                # HELP indexer_documents_processed_total Documents processed
                # TYPE indexer_documents_processed_total counter
                indexer_documents_processed_total 12500
        '500':
          description: Ошибка получения метрик